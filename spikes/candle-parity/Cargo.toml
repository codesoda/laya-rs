[workspace]

[package]
name = "laya-spike"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.102"
candle-core = { version = "0.11.0", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.0", features = ["accelerate"] }
clap = { version = "4.5.60", features = ["derive"] }
libc = "0.2.182"
ndarray = "0.16.1"
ndarray-npy = "0.9.1"
safetensors = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
