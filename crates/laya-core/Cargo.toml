[package]
name = "laya-core"
version = "0.1.0"
description = "Laya decision-model runtime: exact upstream preprocessing, Metal (mlx-rs) and CPU (Candle) backends, native postprocessing"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[features]
default = []
# Apple Silicon: MLX Metal GPU through mlx-rs (JIT build, embedded residual
# metallib, macOS 14+). Not available on other targets.
mlx = ["dep:mlx-rs", "dep:half"]
# Portable CPU backend through Candle. Enable exactly one BLAS feature for
# speed: `candle-accelerate` on macOS, `candle-mkl` on x86-64 Linux.
candle = ["dep:candle-core", "dep:candle-nn"]
candle-accelerate = ["candle", "candle-core/accelerate", "candle-nn/accelerate"]
candle-mkl = ["candle", "candle-core/mkl", "candle-nn/mkl"]

[dependencies]
ryu = "=1.0.23"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
half = { version = "=2.7.1", optional = true }
mlx-rs = { version = "=0.32.0", features = ["safetensors"], optional = true }

[dev-dependencies]
ndarray = "=0.16.1"
ndarray-npy = "=0.9.1"
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
